<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Contacts</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body>
        <header>
            <div class="logo">
            <img src="assets/LOGO.jpg" class="profile-image" alt="Profile Picture">
            <div class="logo-text">Kise Visuals</div>
            </div>

                <nav>
                    <ul class="nav-menu">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="skills.html">Skills</a></li>
                        <li><a href="contact.html" class="active">Contact</a></li>
                    </ul>
                </nav>
        </header>
        
        <main class="contact-container">
            <section class="contact-text">
                <h1>Contacts</h1>
                    <p class="contact-description">Here are the ways you can get in touch with me:</p>
                    <div class="contact-links">
                        <p>Facebook: Kise Visuals</p>
                        <p>Instagram: @kise.film_</p>
                        <p>LinkedIn: Kyle Pullan</p>
                        <p>Number: +63 945 811 1043</p>
                    </div>

            </section>

            <section class="contact-form">
            <h2>Send a Message</h2>
            <form action="#" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="sender-name">Full Name:</label>
                    <input type="text" id="sender-name" name="sender-name" required>
                </div>

                <div class="form-group">
                    <label for="sender-email">Email Address:</label>
                    <input type="email" id="sender-email" name="sender-email" required>
                </div>

                <div class="form-group">
                    <label for="sender-message">Message:</label>
                    <textarea id="sender-message" name="sender-message" rows="5" required></textarea>
                </div>

                <button type="submit" class="button">Submit Message</button>
            </form>
        </section>
        </main>

            <footer>
                <p>2026 My Website. All rights reserved.</p>
            </footer>
    </body>
</html>
